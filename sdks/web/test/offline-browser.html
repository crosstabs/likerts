<script type="module">
import {openIndexedDbOfflineQueue} from '../dist/offline.js';
const name=`likerts-offline-${Date.now()}`;
const sender=async collectionId=>({status:200,receipt:{responseId:'r',collectionId,accepted:true}});
let queue=await openIndexedDbOfflineQueue(name,sender);
await queue.enqueue('c',{idempotencyKey:'key',answers:{secret:'answer'},metadata:{}});
queue=await openIndexedDbOfflineQueue(name,sender);
const pendingAfterReload=(await queue.snapshot()).pending;
const db=await new Promise((resolve,reject)=>{const request=indexedDB.open(name);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
const get=(store,key)=>new Promise((resolve,reject)=>{const request=db.transaction(store).objectStore(store).get(key);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
const records=await get('queue','records'),key=await get('keys','aes');
const ciphertextOpaque=!new TextDecoder().decode(records[0]).includes('answer'),keyNonExtractable=key.extractable===false;
const report=await queue.flush(async()=> 'credential');
globalThis.result={pendingAfterReload,ciphertextOpaque,keyNonExtractable,accepted:report.accepted,pendingFinal:(await queue.snapshot()).pending};
</script>
