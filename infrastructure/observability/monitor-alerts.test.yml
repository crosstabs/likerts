rule_files:
  - monitor-alerts.yml
evaluation_interval: 1m
tests:
  - name: healthy watcher does not page
    interval: 1m
    input_series:
      - series: 'up{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '1+0x10'
      - series: 'probe_success{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: LikertsMonitorHeartbeatUnavailable
        exp_alerts: []
  - name: missing job or missing probe metric pages
    interval: 1m
    alert_rule_test:
      - eval_time: 3m
        alertname: LikertsMonitorHeartbeatUnavailable
        exp_alerts:
          - exp_labels: {job: likerts-monitor-heartbeat, severity: critical}
            exp_annotations: {summary: Likerts monitor heartbeat or its independent probe is unavailable}
  - name: sustained unhealthy heartbeat pages and recovery clears
    interval: 1m
    input_series:
      - series: 'up{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '1+0x10'
      - series: 'probe_success{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '1 0 0 0 0 1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: LikertsMonitorHeartbeatUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: LikertsMonitorHeartbeatUnavailable
        exp_alerts:
          - exp_labels: {job: likerts-monitor-heartbeat, instance: heartbeat, severity: critical}
            exp_annotations: {summary: Likerts monitor heartbeat or its independent probe is unavailable}
      - eval_time: 6m
        alertname: LikertsMonitorHeartbeatUnavailable
        exp_alerts: []
  - name: exporter scrape failure pages even while a prior success sample remains
    interval: 1m
    input_series:
      - series: 'up{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '0+0x5'
      - series: 'probe_success{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: LikertsMonitorHeartbeatUnavailable
        exp_alerts:
          - exp_labels: {job: likerts-monitor-heartbeat, instance: heartbeat, severity: critical}
            exp_annotations: {summary: Likerts monitor heartbeat or its independent probe is unavailable}
  - name: disappearing target pages after staleness
    interval: 1m
    input_series:
      - series: 'up{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '1 1 stale'
      - series: 'probe_success{job="likerts-monitor-heartbeat",instance="heartbeat"}'
        values: '1 1 stale'
    alert_rule_test:
      - eval_time: 5m
        alertname: LikertsMonitorHeartbeatUnavailable
        exp_alerts:
          - exp_labels: {job: likerts-monitor-heartbeat, severity: critical}
            exp_annotations: {summary: Likerts monitor heartbeat or its independent probe is unavailable}
