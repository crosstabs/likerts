global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: likerts
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/likerts_monitor_token
    static_configs:
      - targets: ['api:8080']
  - job_name: likerts-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://api:8080/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
# Internal-network example. Replace static discovery with every Render API instance.
# Public load-balanced health is a separate check and cannot identify a bad replica.
# Configure Alertmanager and an owned receiver during operational activation.
