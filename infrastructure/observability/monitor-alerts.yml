groups:
  - name: likerts-independent-monitor
    rules:
      - alert: LikertsMonitorHeartbeatUnavailable
        expr: |
          probe_success{job="likerts-monitor-heartbeat"} == 0
          or up{job="likerts-monitor-heartbeat"} == 0
          or absent(probe_success{job="likerts-monitor-heartbeat"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Likerts monitor heartbeat or its independent probe is unavailable
