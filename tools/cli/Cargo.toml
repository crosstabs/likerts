[package]
name = "likerts-cli"
version = "0.1.2"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "likerts"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
