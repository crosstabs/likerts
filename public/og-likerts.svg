<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Likerts — Free synthetic market research</title>
  <desc id="desc">A navy Likerts research card with a five-bar distribution and a note that the output is directional, not human panel evidence.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c6fff"/><stop offset="1" stop-color="#49a0ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001126" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#021a38"/>
  <circle cx="1018" cy="38" r="350" fill="#073b82" opacity=".48"/>
  <circle cx="113" cy="640" r="295" fill="#063476" opacity=".45"/>
  <g transform="translate(85 72)">
    <g fill="#2080ff"><rect x="0" y="24" width="12" height="40" rx="6"/><rect x="20" y="10" width="12" height="54" rx="6"/><rect x="40" y="0" width="12" height="64" rx="6"/><rect x="60" y="14" width="12" height="50" rx="6"/><rect x="80" y="27" width="12" height="37" rx="6"/></g>
    <text x="117" y="51" fill="white" font-family="Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1">Likerts</text>
  </g>
  <text x="85" y="218" fill="white" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Free synthetic</text>
  <text x="85" y="286" fill="white" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">market research.</text>
  <text x="89" y="340" fill="#c7d9f4" font-family="Arial, sans-serif" font-size="23">Current sources · Market context · Multi-model review</text>
  <g transform="translate(720 185)" filter="url(#shadow)">
    <rect width="394" height="305" rx="16" fill="#fff"/>
    <text x="30" y="45" fill="#08152a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Likelihood distribution</text>
    <text x="30" y="75" fill="#68758a" font-family="Arial, sans-serif" font-size="13">Illustrative synthetic output</text>
    <rect x="30" y="120" width="60" height="78" rx="6" fill="#ff8a6d"/><rect x="96" y="120" width="51" height="78" rx="6" fill="#ffc1b0"/><rect x="153" y="120" width="57" height="78" rx="6" fill="#d9dde4"/><rect x="216" y="120" width="71" height="78" rx="6" fill="#b7d0fb"/><rect x="293" y="120" width="71" height="78" rx="6" fill="url(#glow)"/>
    <text x="30" y="245" fill="#0967f7" font-family="Arial, sans-serif" font-size="14" font-weight="700">Source context</text>
    <text x="30" y="272" fill="#415068" font-family="Arial, sans-serif" font-size="14">Not human panel evidence</text>
  </g>
  <rect x="85" y="455" width="440" height="54" rx="27" fill="#0967f7"/>
  <text x="119" y="490" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="700">Free to use · No account required</text>
</svg>
