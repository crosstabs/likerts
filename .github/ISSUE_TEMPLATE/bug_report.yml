name: Bug report
description: Report a reproducible problem in the Likerts game.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data and remove credentials or private room access. Suspected vulnerabilities belong in the private reporting flow in SECURITY.md."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Browser game, iPhone app, Messages game, Quiz creation or practice, Live server or reconnect, Marketing website, Accessibility]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Commit, browser or OS, and relevant runtime version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
