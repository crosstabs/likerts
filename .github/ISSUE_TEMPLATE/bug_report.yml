name: Bug report
description: Report a reproducible problem in Likerts or its SDKs.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Use synthetic data and remove credentials. Suspected vulnerabilities belong in the private reporting flow described in SECURITY.md."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - API or PostgreSQL
        - MCP or CLI
        - Web SDK
        - React Native SDK
        - iOS SDK
        - Android SDK
        - Flutter SDK
        - Website or documentation
        - Deployment
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Commit or package version, OS/browser and relevant runtime version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Smallest reproduction
      description: Steps or a minimal synthetic example someone else can run.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error message or status code, with secrets removed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional screenshots, attempted workaround or relevant regression commit.
