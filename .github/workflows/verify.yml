name: Verify game

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the protected main branch's required check names.
  interfaces-and-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: likerts_live_test
          POSTGRES_USER: likerts_ci
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U likerts_ci -d likerts_live_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            game/WebSource/live-game/package-lock.json
            control-plane/package-lock.json
      - name: Install locked game and website dependencies
        run: |
          npm ci --prefix game/WebSource/live-game --ignore-scripts
          npm ci --prefix control-plane --ignore-scripts
      - name: Verify the reviewed runtime
        run: npm run check:runtime --prefix game/WebSource/live-game
      - name: Run every game and actual PostgreSQL test
        working-directory: game/WebSource/live-game
        env:
          # Disposable service-container credentials, never a provider database.
          LIKERTS_LIVE_TEST_DATABASE_URL: postgres://likerts_ci:disposable-ci-fixture@127.0.0.1:54329/likerts_live_test
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/likerts-game-tests.tap"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.env.RUNNER_TEMP + '/likerts-game-tests.tap', 'utf8');
          const count = key => Number([...text.matchAll(new RegExp('^# ' + key + ' (\\d+)$', 'gm'))].at(-1)?.[1]);
          assert.ok(count('tests') > 0, 'The full game suite must execute');
          assert.equal(count('fail'), 0);
          assert.equal(count('skipped'), 0, 'The PostgreSQL fixture must run every opt-in case');
          assert.equal(count('pass'), count('tests'));
          JS
      - name: Check game website, retired routes and production build
        run: npm run check --prefix control-plane

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the locked game runtime image
        run: docker build --tag likerts-game:ci game/WebSource/live-game
      - name: Exercise the actual container and fail-closed production startup
        run: |
          set -euo pipefail
          if docker run --rm likerts-game:ci; then
            echo 'Production startup accepted missing database and origin configuration.' >&2
            exit 1
          fi
          fixture="likerts-game-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$fixture"; docker rm --force "$fixture" >/dev/null' EXIT
          docker run --detach --name "$fixture" \
            --env NODE_ENV=development \
            --env LIKERTS_LIVE_BIND_ADDRESS=127.0.0.1 \
            --env LIKERTS_LIVE_SQLITE_PATH=/tmp/likerts-ci.sqlite \
            likerts-game:ci
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$fixture" node -e "fetch('http://127.0.0.1:4311/api/live/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker exec --interactive "$fixture" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { randomBytes, randomUUID } from 'node:crypto';
          const origin = 'http://127.0.0.1:4311';
          const request = async (path, body, token) => {
            const response = await fetch(origin + path, {
              method: body ? 'POST' : 'GET',
              headers: { Origin: origin, ...(body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) },
              body: body ? JSON.stringify(body) : undefined,
            });
            return { status: response.status, body: await response.json() };
          };
          for (const path of ['/play', '/play/quizzes', '/play/assets/totem-platform.png']) {
            assert.equal((await fetch(origin + path)).status, 200, path);
          }
          assert.equal((await fetch(origin + '/surveys')).status, 404);
          const catalogue = await request('/api/live/catalogue');
          assert.equal(catalogue.status, 200);
          assert.equal(catalogue.body.topics.length, 20);
          const admission = () => ({ admissionId: randomUUID(), recoverySecret: randomBytes(32).toString('base64url') });
          const created = await request('/api/live/rooms', { ...admission(), settings: {} });
          assert.equal(created.status, 201);
          const host = created.body;
          const joined = await request('/api/live/rooms/' + host.code + '/join', { ...admission(), nickname: 'ContainerQA', acceptRoomSharing: true });
          assert.equal(joined.status, 201);
          const closed = await request('/api/live/rooms/' + host.code + '/actions', { requestId: randomUUID(), matchId: host.state.matchId, action: 'close' }, host.token);
          assert.equal(closed.status, 200);
          assert.equal((await request('/api/live/rooms/' + host.code, undefined, joined.body.token)).status, 404);
          console.log('Container static, durable admission, join, close and revoked access checks passed.');
          JS
