name: Verify foundations

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaces-and-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Select Rust and format checker
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
      - name: Formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --check
      - name: Backend, API, MCP, CLI and Web integration
        run: bash scripts/check.sh
      - name: Community archive integrity and standalone MCP installation
        run: |
          node --test scripts/package-community-release.test.mjs
          node --test scripts/bounded-client-command.test.mjs scripts/check-markdown-links.test.mjs
          node scripts/check-markdown-links.mjs
          node scripts/check-mcp-package.mjs
      - name: Render Blueprint and fail-closed entrypoint checks
        run: bash scripts/check-render-iac.sh
      - name: Shared admission across two API processes and real Redis
        run: bash scripts/check-admission.sh
      - name: Render-compatible non-superuser owner provisioning
        run: bash scripts/check-render-roles.sh
      - name: Real PostgreSQL with restricted runtime role
        run: bash scripts/check-postgres.sh
      - name: Restricted erasure archiver executable
        run: |
          cargo build --manifest-path backend/Cargo.toml --locked --bin likerts-erasure-archive --bin likerts-migrate
          node infrastructure/erasure-archive/check-local.mjs
      - name: Durable export lease recovery
        run: bash scripts/check-export-leases.sh
      - name: Durable response webhooks, restricted worker and interface parity
        run: bash scripts/check-webhook-isolation.sh
      - name: S3-compatible durable export object store
        run: bash scripts/check-s3-object-store.sh
      - name: Monitoring configuration and alert behavior
        run: bash scripts/check-observability.sh
      - name: Open-source control plane and public contract
        run: bash scripts/check-launch-platform.sh

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Build immutable runtime candidate and exercise deployment boundaries
        run: bash scripts/check-recovery.sh
      - name: Select pinned Rust for the documented first-response flow
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Durable Compose quickstart and restart persistence
        env:
          LIKERTS_SKIP_IMAGE_BUILD: '1'
          LIKERTS_LOCAL_IMAGE: likerts:container-check
        run: bash scripts/check-local-compose.sh
      - name: Anonymous released CLI and npm Web browser lifecycle
        env:
          LIKERTS_SKIP_IMAGE_BUILD: '1'
          LIKERTS_LOCAL_IMAGE: likerts:container-check
        run: node scripts/check-newcomer.mjs

      - name: Published Web SDK in a production Next.js host
        run: |
          npm ci --prefix examples/nextjs-feedback
          npm run build --prefix examples/nextjs-feedback
          node examples/nextjs-feedback/node_modules/playwright/cli.js install --with-deps chromium
          npm run check --prefix examples/nextjs-feedback

      - name: Published Web SDK in Vue and Svelte hosts
        run: |
          for framework in vue svelte; do
            npm ci --prefix "examples/$framework-feedback"
            npm run build --prefix "examples/$framework-feedback"
            node "examples/$framework-feedback/node_modules/playwright/cli.js" install --with-deps chromium
            npm run check --prefix "examples/$framework-feedback"
          done
      - name: Chromium Firefox and WebKit keyboard and RTL matrix
        run: |
          npm ci --prefix sdks/web
          node sdks/web/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
          bash scripts/check-web-browsers.sh

# No registry push, cloud deployment or credentials are configured here.
# Mobile device, platform and all-SDK gates remain part of release rehearsal.
