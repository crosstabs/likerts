name: Production Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LIKERTS_EVAL_LIVE: "0"
  VITE_LIKERTS_VERCEL_ANALYTICS: "disabled"

jobs:
  quality-gates:
    name: Test, build, static, security, and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: node scripts/ci-static-check.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify generated study content
        run: npm run studies:verify

      - name: Security checks
        run: node scripts/ci-security-check.mjs

      - name: Install browser gate runtime
        run: npx playwright install --with-deps chromium

      - name: Verify the built CJK browser matrix
        env:
          LIKERTS_BROWSER_URL: http://127.0.0.1:4173
          LIKERTS_BROWSER_BUILD_ID: ${{ github.sha }}
          LIKERTS_BROWSER_BUILD_DIRECTORY: dist
          LIKERTS_BROWSER_ATTESTATION_OUT: artifacts/localization-browser/attestation.json
          LIKERTS_BROWSER_ATTESTATION_PUBLICATION_STATUS: CI_ARTIFACT
          VERIFY_BROWSER_SCREENSHOTS: artifacts/localization-browser/screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/likerts-preview.log" 2>&1 &
          preview_process_id=$!
          trap 'kill "$preview_process_id"' EXIT
          node --input-type=module -e 'const url = process.env.LIKERTS_BROWSER_URL; let ready = false; for (let attempt = 0; attempt < 60; attempt += 1) { try { const response = await fetch(url); if (response.ok) { ready = true; break; } } catch {} await new Promise((resolve) => setTimeout(resolve, 500)); } if (!ready) throw new Error(`Preview did not become ready: ${url}`);'
          npm run verify:browser
          STUDY_LIBRARY_URL=http://127.0.0.1:4173/studies/index.html \
          STUDY_LIBRARY_DETAIL_URL=http://127.0.0.1:4173/en-us/studies/ai-copilot-pilot-small-business-us/index.html \
          npm run studies:verify:browser

      - name: Build immutable unpublished browser evidence bundle
        run: >-
          npm run attestation:bundle --
          --attestation artifacts/localization-browser/attestation.json
          --artifact-directory dist
          --output artifacts/localization-browser/evidence-bundle

      - name: Verify immutable unpublished browser evidence bundle
        run: npm run attestation:bundle:verify -- artifacts/localization-browser/evidence-bundle

      - name: Upload immutable browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: localization-browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/localization-browser
          if-no-files-found: error
          retention-days: 30
