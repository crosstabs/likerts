name: Likerts
options:
  bundleIdPrefix: studio.likerts
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: BPB7F949FW
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LIKERTS_PRIVACY_POLICY_URL: ''
    LIKERTS_SUPPORT_URL: 'https://likerts.com/game/support'
targets:
  Likerts:
    type: application
    platform: iOS
    sources: [Likerts]
    dependencies:
      - target: LikertsMessages
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.likerts.game
        INFOPLIST_FILE: Likerts/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '2'
  LikertsMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - LikertsMessages
      - Likerts/Core
      - Likerts/Messages
      - Likerts/UI/DesignSystem.swift
      - Likerts/UI/GameAudio.swift
      - Likerts/UI/ContentSafetyControls.swift
      - Likerts/UI/SoundSettingsView.swift
      - Likerts/UI/SupportPrivacyView.swift
      - Likerts/UI/GameSession.swift
      - Likerts/UI/RoundViews.swift
      - Likerts/UI/TotemRoundView.swift
      - Likerts/UI/TotemDesign.swift
      - Likerts/UI/TopicSceneView.swift
      - Likerts/UI/TopicSpriteBounds.swift
      - Likerts/UI/StorySceneView.swift
      - Likerts/UI/StoryHomeCast.swift
      - Likerts/UI/TradeSnackPerformanceView.swift
      - Likerts/UI/MotionPerformanceSceneView.swift
      - Likerts/UI/MotionProbe.swift
      - Likerts/UI/StoryCastBounds.swift
      - Likerts/UI/StoryPropBounds.swift
      - Likerts/UI/StoryAtlasExtraction.swift
      - Likerts/UI/StoryWearableArt.swift
      - Likerts/TotemAssets.xcassets
      - Likerts/TopicAssets.xcassets
      - Likerts/StoryAssets.xcassets
      - Likerts/UI/InsightCard.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.likerts.game.messages
        INFOPLIST_FILE: LikertsMessages/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '2'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LikertsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LikertsTests
      - path: ../SharedFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Likerts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LikertsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LikertsUITests]
    dependencies:
      - target: Likerts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LikertsLaunchPerformance:
    build:
      targets:
        Likerts: all
    test:
      config: Release
      targets:
        - LikertsUITests
  LikertsMessages:
    build:
      targets:
        Likerts: all
        LikertsMessages: all
  Likerts:
    build:
      targets:
        Likerts: all
    test:
      targets:
        - LikertsTests
        - LikertsUITests
